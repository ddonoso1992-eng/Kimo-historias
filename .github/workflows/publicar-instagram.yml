name: Publicar en Instagram

# Mini Metricool: cada 10 minutos publica lo que esté en programados/ y ya tenga su hora.
# También corre al subir algo nuevo, para las comprobaciones sin publicar.
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  push:
    branches: [main]
    paths:
      - "programados/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Publicar lo que toca
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 tools/ig_publicar.py
